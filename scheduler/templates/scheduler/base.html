<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Timetable Scheduler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="{% url 'index' %}">School Scheduler</a>
      
      <!-- Toggler for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible content -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white fw-medium" href="{% url 'school_list' %}">Schools</a>
          <a class="nav-link text-white fw-medium" href="{% url 'add_subjects' %}">Add Subjects</a>
          <a class="nav-link text-white fw-medium" href="{% url 'add_teacher' %}">Add Teacher</a>
          <a class="nav-link text-white fw-medium" href="{% url 'assign_teacher' %}">Assign Teacher</a>
          <a class="nav-link text-white fw-medium" href="{% url 'generate_timetable' %}">Generate Timetable</a>
          <a class="nav-link text-white fw-medium" href="{% url 'teacher_routine' %}">Teacher Routine</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}
  {% endblock %}
</body>
</html>
